<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="/css/base/reset.css">
  <link rel="stylesheet" href="/css/base/variables.css">
  <link rel="stylesheet" href="/css/base/typography.css">
  <link rel="stylesheet" href="/css/base/style.css">
  <link rel="stylesheet" href="/css/components/navbar.css">
  <link rel="stylesheet" href="/css/components/cara.css">
  <link rel="stylesheet" href="/css/pages/communities.css">
  <link rel="stylesheet" href="/css/base/ambient.css">
</head>
<body>

  <!-- ── Universal Navbar ──────────────────────────────────── -->
  <nav class="navbar">
    <div class="container">

      <a href="/" class="nav-logo">
        <img src="/images/Logo.png" alt="RevXChange Logo">
      </a>

      <ul class="nav-links">
        <li><a href="used-cars.html">Used Cars</a></li>
        <li><a href="buy-cars.html">New Cars</a></li>
        <li><a href="#">Auctioned Cars</a></li>
        <li>
          <a href="#" class="cara-nav-link" id="caraNavBtn">
            <svg class="cara-icon" viewBox="0 0 24 24" fill="none" width="15" height="15">
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/>
              <path d="M8.5 13C8.5 10.5 10.1 8.8 12 8.8C13.9 8.8 15.5 10.5 15.5 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <circle cx="9.5" cy="15" r="1.1" fill="currentColor"/>
              <circle cx="14.5" cy="15" r="1.1" fill="currentColor"/>
            </svg>
            <span class="cara-text">Cara AI</span>
            <span class="cara-spark"></span>
            <span class="cara-spark"></span>
            <span class="cara-spark"></span>
            <span class="cara-spark"></span>
            <span class="cara-spark"></span>
          </a>
        </li>
        <li><a href="/feed.html">Car Communities</a></li>
        <span class="nav-indicator" id="navIndicator"></span>
      </ul>

      <div class="nav-actions">
        <a href="sell-car.html" class="sell-btn">+ Sell My Car</a>
        <a href="login.html" class="login-btn" id="loginBtn">Login</a>

        <div class="profile-menu hidden" id="profileMenu">
          <button class="profile-trigger" id="profileTrigger">
            <div class="profile-avatar">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
              </svg>
            </div>
            <span class="profile-name" id="profileName">User</span>
            <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path d="M7 10l5 5 5-5z"/>
            </svg>
          </button>

          <ul class="dropdown" id="dropdownMenu">
            <li class="dropdown-header">
              <div class="dropdown-avatar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
                </svg>
              </div>
              <span id="dropdownName">User</span>
            </li>
            <li><a href="dashboard.html?tab=ads">My Ads</a></li>
            <li><a href="dashboard.html?tab=saved">Saved Ads</a></li>
            <li><a href="dashboard.html?tab=posts">My Posts</a></li>
            <li><a href="dashboard.html?tab=settings">Settings</a></li>
            <li class="dropdown-logout">
              <a href="#" id="logoutBtn">
                Logout
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>

            </li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <!-- ── Page Hero ──────────────────────────────────────────── -->
  <section class="comm-hero">
    <div class="container">
      <h1>Car Communities</h1>
      <p>One community per model. Find owners, mechanics, and real advice.</p>
    </div>

    <!-- Hero → BG melt -->
    <div class="rx-melt-wrap">
      <svg viewBox="0 0 1440 74" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="meltMainCM" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#5a0f1c" stop-opacity="1"/>
            <stop offset="55%"  stop-color="#6b1222" stop-opacity="0.80"/>
            <stop offset="100%" stop-color="#3e0a13" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="meltBloomCM" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#8b1a2a" stop-opacity="0.45"/>
            <stop offset="70%"  stop-color="#5a0f1c" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#5a0f1c" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path fill="url(#meltBloomCM)">
          <animate attributeName="d" dur="9s" repeatCount="indefinite" calcMode="spline"
            keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1"
            values="
              M0,0 L1440,0 L1440,60 C1300,74 1080,28 900,55 C720,74 520,18 360,52 C200,72 80,30 0,58 Z;
              M0,0 L1440,0 L1440,44 C1260,68 1020,14 840,50 C640,72 440,10 270,48 C120,68 40,24 0,44 Z;
              M0,0 L1440,0 L1440,68 C1320,40 1060,72 840,38 C620,8  380,68 180,36 C80,18 30,52 0,30 Z;
              M0,0 L1440,0 L1440,60 C1300,74 1080,28 900,55 C720,74 520,18 360,52 C200,72 80,30 0,58 Z
            "/>
        </path>
        <path fill="url(#meltMainCM)">
          <animate attributeName="d" dur="9s" repeatCount="indefinite" calcMode="spline"
            keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1"
            values="
              M0,0 L1440,0 L1440,42 C1300,58 1080,12 900,38 C720,58 520,6  360,36 C200,58 80,16 0,40 Z;
              M0,0 L1440,0 L1440,28 C1260,50 1020,2  840,34 C640,58 440,0  270,32 C120,52 40,10 0,28 Z;
              M0,0 L1440,0 L1440,52 C1320,24 1060,56 840,22 C620,0  380,52 180,20 C80,4  30,38 0,14 Z;
              M0,0 L1440,0 L1440,42 C1300,58 1080,12 900,38 C720,58 520,6  360,36 C200,58 80,16 0,40 Z
            "/>
        </path>
      </svg>
    </div>
  </section>

  <!-- ── Communities Layout ──────────────────────────────────── -->
  <section class="comm-layout-section">
    <div class="container">
      <div class="comm-layout">

        <!-- LEFT: Explore Communities (60%) -->
        <div class="comm-explore">
          <div class="comm-explore-header">
            <h2 class="comm-section-title">Explore Communities</h2>
            <div class="comm-search-wrap">
              <input type="text" id="commSearch" placeholder="Search communities...">
            </div>
          </div>
          <div class="comm-grid" id="commGrid">
            <!-- Populated by JS -->
          </div>
        </div>

        <!-- RIGHT: Your Communities (40%) -->
        <div class="comm-yours">
          <h2 class="comm-section-title">Your Communities</h2>
          <div class="comm-yours-list" id="commYoursList">
            <!-- Populated by JS -->
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- ── Community Feed (hidden until Stage D) ─────────────────── -->
  <section class="comm-feed-section" id="commFeed" style="display:none;">
    <div class="container">
      <div class="comm-feed-box">
        <div class="comm-feed-header" id="commFeedHeader"></div>
        <div class="comm-sort-bar">
          <button class="sort-btn active" data-sort="top">🔥 Top</button>
          <button class="sort-btn" data-sort="new">🕐 New</button>
          <button class="sort-btn" data-sort="hot">📈 Trending</button>
          <button class="sort-btn" data-sort="controversial">⚡ Controversial</button>
        </div>
        <div class="posts-list" id="postsList"></div>
      </div>
    </div>
  </section>

  <script src="/js/ambient.js"></script>
  <script src="/js/communities.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/cara.js"></script>
</body>
</html>
